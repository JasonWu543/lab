[project]
name = "minivllm"
version = "0.1.0"
description = "M4: mini-vLLM 推理系统 lab（基座用官方 transformers，不重写模型）"
requires-python = ">=3.10"
dependencies = ["torch", "transformers"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["minivllm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
