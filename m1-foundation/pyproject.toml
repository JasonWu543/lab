[project]
name = "minilm"
version = "0.1.0"
description = "M1 foundation: BPE tokenizer, minimal autograd, Qwen-like transformer, trainer"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "regex",  # GPT-2 预分词 pattern 需要 \p{L} 等 unicode 属性类
]

[project.optional-dependencies]
dev = [
    "pytest",
    "torch",            # 数值对齐测试的参考实现
    "tokenizers",       # T3/B1: HF BPE 参考对齐与吞吐对比
    "huggingface_hub",  # 数据集下载
    "transformers",     # T7: Qwen2.5 权重加载与对比验证
    "safetensors",      # T7: 加载 .safetensors 格式权重
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
